name: Release

# Build the portable Windows exe and attach it to a GitHub Release whenever a
# version tag (v*) is pushed. See docs/release.md for the release workflow.

on:
  push:
    tags:
      - "v*"

# The gh-release step needs write access to create the release + upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag format
        run: |
          if ($env:TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Tag '$env:TAG' is not a release tag. Release tags must be vX.Y.Z (for example v0.2.0)."
          }

      - name: Verify tag matches the manifest versions
        run: |
          $version = $env:TAG.Substring(1)
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          # Anchored to the [package] table so dependency versions can't match.
          $cargoMatch = [regex]::Match($cargo, '\[package\][^\[]*?\bversion\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) {
            throw "Could not find the [package] version in src-tauri/Cargo.toml"
          }
          $manifests = [ordered]@{
            "package.json" = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "src-tauri/Cargo.toml" = $cargoMatch.Groups[1].Value
            "src-tauri/tauri.conf.json" = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          $mismatched = $manifests.GetEnumerator() | Where-Object { $_.Value -ne $version }
          if ($mismatched) {
            $detail = ($mismatched | ForEach-Object { "  $($_.Key): $($_.Value)" }) -join "`n"
            throw "Tag '$env:TAG' expects version $version, but these files disagree (run ``pnpm bump``):`n$detail"
          }

      # The hand-written notes become the release description; the auto-generated
      # commit list is appended below them by the publish step.
      - name: Extract the changelog entry
        run: |
          $version = $env:TAG.Substring(1)
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+v$([regex]::Escape($version))(?!\d)") {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## $env:TAG' section. Write the changelog entry for $env:TAG before tagging."
          }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $body += $lines[$i]
          }
          $notes = ($body -join "`n").Trim()
          if (-not $notes) {
            throw "The '## $env:TAG' section in CHANGELOG.md is empty. Write the changelog entry for $env:TAG before tagging."
          }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $notes -Encoding utf8

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc && vite build`, so this is the frontend typecheck.
      - name: Typecheck and build frontend
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # --no-bundle builds the release exe only (no NSIS/MSI installers). The
      # frontend build runs automatically via tauri.conf.json beforeBuildCommand.
      - name: Build release exe
        run: pnpm tauri build --no-bundle

      # The asset names carry no version so the files keep stable download URLs
      # across releases; the version lives in the tag and release name.
      - name: Verify portable exe
        run: |
          $exe = "src-tauri/target/release/valorant-lightweight-tracker.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected build output not found: $exe"
          }

      # The auto-updater downloads this beside the exe and refuses to install a
      # binary that hashes to anything else. Content: the lowercase hex digest
      # alone (see src-tauri/src/updater.rs `parse_checksum`).
      - name: Compute SHA-256 checksum
        run: |
          $exe = "src-tauri/target/release/valorant-lightweight-tracker.exe"
          $digest = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value $digest -NoNewline -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/valorant-lightweight-tracker.exe
            src-tauri/target/release/valorant-lightweight-tracker.exe.sha256
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
